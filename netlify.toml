[build]
  command = "npm run build"
  publish = "dist/vetpax_web_frontend/browser"

[build.environment]
  NODE_VERSION = "22.12.0"

[[redirects]]
  from = "/api/*"
  to = "https://vetpax-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
